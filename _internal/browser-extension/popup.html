<!doctype html><html lang="en"><head><meta charset="utf-8"><title>OF Saver</title><link rel="stylesheet" href="popup.css"></head><body>
<h1>OF Saver</h1><p>Connect the session in your selected OnlyFans tab to your local desktop profile.</p>
<p id="status" role="status">Checking local connection…</p>
<label id="replaceRow" hidden><input id="replace" type="checkbox">Replace this profile’s saved credentials</label>
<button id="connect">Connect active tab</button><button id="save" hidden>Save session to OF Saver</button><button id="disconnect" hidden>Disconnect</button>
<p class="hint">While connected, refresh the OnlyFans page to capture its account header. Reopen this popup to save. Connection expires after two minutes.</p>
<script src="popup.js"></script></body></html>
